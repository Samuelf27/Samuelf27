<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C7B"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101D30"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#2DD4BF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- grade de pontos sutil -->
  <g fill="#A6B8C9" opacity="0.5">
    <g id="dr">
      <circle cx="60"  cy="36" r="2"/><circle cx="140" cy="36" r="2"/><circle cx="220" cy="36" r="2"/>
      <circle cx="300" cy="36" r="2"/><circle cx="380" cy="36" r="2"/><circle cx="460" cy="36" r="2"/>
      <circle cx="540" cy="36" r="2"/><circle cx="620" cy="36" r="2"/><circle cx="700" cy="36" r="2"/>
      <circle cx="780" cy="36" r="2"/><circle cx="860" cy="36" r="2"/><circle cx="940" cy="36" r="2"/>
      <circle cx="1020" cy="36" r="2"/><circle cx="1100" cy="36" r="2"/><circle cx="1180" cy="36" r="2"/>
      <circle cx="1260" cy="36" r="2"/><circle cx="1340" cy="36" r="2"/><circle cx="1420" cy="36" r="2"/>
      <circle cx="1500" cy="36" r="2"/><circle cx="1580" cy="36" r="2"/>
    </g>
    <use href="#dr" y="80"/>
    <use href="#dr" y="160"/>
    <use href="#dr" y="240"/>
    <use href="#dr" y="320"/>
  </g>

  <!-- kicker -->
  <text x="96" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600"
        fill="#0E8F86" letter-spacing="6">DESENVOLVEDOR FULL-STACK</text>

  <!-- nome -->
  <text x="94" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="700"
        fill="#16202E" letter-spacing="-2">Samuel <tspan fill="#0E8F86">Ferreira</tspan></text>
  <rect x="98" y="242" width="320" height="6" rx="3" fill="url(#accent)"/>

  <!-- stack -->
  <text x="98" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400"
        fill="#4A5D70">TypeScript · React / Next.js · Node.js · PostgreSQL</text>
  <text x="98" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600"
        fill="#7A8CA0" letter-spacing="2">TESTES · CI/CD · DEPLOY · OPEN-SOURCE</text>

  <!-- terminal -->
  <circle cx="1300" cy="200" r="200" fill="url(#glowP)"/>
  <g>
    <rect x="1080" y="86" width="424" height="228" rx="14" fill="url(#term)" stroke="#1E3A52" stroke-width="2"/>
    <rect x="1080" y="86" width="424" height="42" rx="14" fill="#152438"/>
    <rect x="1080" y="112" width="424" height="16" fill="#152438"/>
    <circle cx="1108" cy="107" r="7" fill="#F26D6D"/>
    <circle cx="1132" cy="107" r="7" fill="#E9C46A"/>
    <circle cx="1156" cy="107" r="7" fill="#2DD4BF"/>
    <text x="1292" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5F7A94" text-anchor="middle">samuel@dev — zsh</text>

    <g font-family="Cascadia Code, Consolas, monospace" font-size="20">
      <text x="1112" y="166" fill="#7BEDE0">const <tspan fill="#EAF1F8">dev</tspan> <tspan fill="#5F7A94">=</tspan> <tspan fill="#EAF1F8">{</tspan></text>
      <text x="1136" y="198" fill="#9FB2C4">stack<tspan fill="#5F7A94">:</tspan> <tspan fill="#E9C46A">'TS · React · Node'</tspan><tspan fill="#5F7A94">,</tspan></text>
      <text x="1136" y="230" fill="#9FB2C4">foco<tspan fill="#5F7A94">:</tspan> <tspan fill="#E9C46A">'testes, CI e deploy'</tspan><tspan fill="#5F7A94">,</tspan></text>
      <text x="1136" y="262" fill="#9FB2C4">aberto_a<tspan fill="#5F7A94">:</tspan> <tspan fill="#E9C46A">'novos projetos'</tspan><tspan fill="#5F7A94">,</tspan></text>
      <text x="1112" y="294" fill="#EAF1F8">};<tspan fill="#2DD4BF"> ▊</tspan></text>
    </g>
  </g>

  <!-- fio de luz na base -->
  <rect x="0" y="396" width="1600" height="4" fill="url(#accent)" opacity="0.9"/>
</svg>
