<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientTransform="translate(140 90) scale(420)">
      <stop stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientTransform="translate(1080 300) scale(380)">
      <stop stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)" mask="url(#dotmask)"/>
  <rect width="1200" height="360" fill="url(#glowL)"/>
  <rect width="1200" height="360" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- texto principal -->
  <text x="72" y="92" fill="#22d3ee" font-size="16" font-weight="700" letter-spacing="6">DESENVOLVEDOR FULL-STACK</text>

  <text x="70" y="172" font-size="74" font-weight="800" fill="url(#shimmer)" letter-spacing="-1">Samuel Ferreira</text>

  <!-- linha de acento animada -->
  <rect x="72" y="196" width="0" height="5" rx="2.5" fill="url(#grad)">
    <animate attributeName="width" from="0" to="360" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>

  <text x="72" y="246" font-size="26" font-weight="600" fill="#e7e7f2">TypeScript · React / Next.js · Node.js</text>
  <text x="72" y="284" font-size="18" fill="#9a9ab2">Código testado · CI/CD · Deploy · Open-Source</text>

  <!-- chips de prova -->
  <g font-size="14" font-weight="600">
    <g transform="translate(72 312)">
      <rect width="146" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.4"/>
      <text x="16" y="20" fill="#c4b5fd">🧪 70+ testes</text>
    </g>
    <g transform="translate(230 312)">
      <rect width="150" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="16" y="20" fill="#67e8f9">⚙️ CI/CD ativo</text>
    </g>
    <g transform="translate(392 312)">
      <rect width="242" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="17" y="20" fill="#6ee7b7">🧙 Contribuidor open-source</text>
    </g>
  </g>

  <!-- janela de código (lado direito) -->
  <g transform="translate(770 96)">
    <rect width="356" height="186" rx="14" fill="#12121f" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="356" height="34" rx="14" fill="#1a1a2b"/>
    <rect y="20" width="356" height="14" fill="#1a1a2b"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="17" r="5.5" fill="#27c93f"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="14.5">
      <text x="22" y="72"><tspan fill="#c084fc">const</tspan><tspan fill="#67e8f9"> dev</tspan><tspan fill="#9a9ab2"> = {</tspan></text>
      <text x="40" y="98"><tspan fill="#93c5fd">foco</tspan><tspan fill="#9a9ab2">: </tspan><tspan fill="#86efac">'qualidade'</tspan><tspan fill="#9a9ab2">,</tspan></text>
      <text x="40" y="124"><tspan fill="#93c5fd">entrega</tspan><tspan fill="#9a9ab2">: </tspan><tspan fill="#86efac">'do código ao deploy'</tspan><tspan fill="#9a9ab2">,</tspan></text>
      <text x="40" y="150"><tspan fill="#93c5fd">aprende</tspan><tspan fill="#9a9ab2">: </tspan><tspan fill="#fca5a5">true</tspan><tspan fill="#9a9ab2">,</tspan></text>
      <text x="22" y="176" fill="#9a9ab2">};</text>
      <text x="42" y="176" fill="#22d3ee" font-weight="700">_
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
