<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" role="img" aria-labelledby="bt bd">
<title id="bt">Padrão de engenharia aplicado em todos os repositórios</title>
<desc id="bd">Cinco módulos: branches (duas permanentes, dev para main), promoção (só por pull request, origem conferida), integração (typecheck, teste e build antes do merge), entrega (docker, versionamento semântico e release marcada) e manutenção (dependabot ativo em todo repositório).</desc>
<defs><style>
.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.ind{opacity:1;animation-duration:10s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}.a4{animation-name:a4}.a5{animation-name:a5}
@keyframes a1{0%,4%{opacity:.16}10%,84%{opacity:1}92%,100%{opacity:.16}}
@keyframes a2{0%,12%{opacity:.16}18%,84%{opacity:1}92%,100%{opacity:.16}}
@keyframes a3{0%,20%{opacity:.16}26%,84%{opacity:1}92%,100%{opacity:.16}}
@keyframes a4{0%,28%{opacity:.16}34%,84%{opacity:1}92%,100%{opacity:.16}}
@keyframes a5{0%,36%{opacity:.16}42%,84%{opacity:1}92%,100%{opacity:.16}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ind{opacity:1}}
</style></defs>

<rect x="0" y="0" width="760" height="168" rx="8" fill="#121722"/>
<path d="M0 8a8 8 0 0 1 8-8h744a8 8 0 0 1 8 8v29H0z" fill="#171D2A"/>
<line x1="1" y1="37" x2="759" y2="37" stroke="#202838" stroke-width="1"/>

<text class="mono" x="20" y="23" font-size="11.5"><tspan fill="#34D399">samuelf27</tspan><tspan fill="#6B7788"> / </tspan><tspan fill="#7A8699">padrão de engenharia</tspan></text>
<text class="mono" x="740" y="23" font-size="10" letter-spacing="1.2" text-anchor="end" fill="#7A8699">10 REPOSITÓRIOS PÚBLICOS</text>

<line x1="164" y1="52" x2="164" y2="148" stroke="#202838" stroke-width="1"/>
<line x1="308" y1="52" x2="308" y2="148" stroke="#202838" stroke-width="1"/>
<line x1="452" y1="52" x2="452" y2="148" stroke="#202838" stroke-width="1"/>
<line x1="596" y1="52" x2="596" y2="148" stroke="#202838" stroke-width="1"/>

<rect class="ind a1" x="78" y="68" width="28" height="3" rx="1.5" fill="#34D399"/>
<text class="mono" x="92" y="101" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#E8ECF3">BRANCHES</text>
<text class="sans" x="92" y="121" font-size="10.5" text-anchor="middle" fill="#7A8699">duas permanentes</text>
<text class="sans" x="92" y="136" font-size="10.5" text-anchor="middle" fill="#7A8699">dev → main</text>
<rect class="ind a2" x="222" y="68" width="28" height="3" rx="1.5" fill="#34D399"/>
<text class="mono" x="236" y="101" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#E8ECF3">PROMOÇÃO</text>
<text class="sans" x="236" y="121" font-size="10.5" text-anchor="middle" fill="#7A8699">só por pull request</text>
<text class="sans" x="236" y="136" font-size="10.5" text-anchor="middle" fill="#7A8699">origem conferida</text>
<rect class="ind a3" x="366" y="68" width="28" height="3" rx="1.5" fill="#34D399"/>
<text class="mono" x="380" y="101" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#E8ECF3">INTEGRAÇÃO</text>
<text class="sans" x="380" y="121" font-size="10.5" text-anchor="middle" fill="#7A8699">typecheck · teste</text>
<text class="sans" x="380" y="136" font-size="10.5" text-anchor="middle" fill="#7A8699">build antes do merge</text>
<rect class="ind a4" x="510" y="68" width="28" height="3" rx="1.5" fill="#34D399"/>
<text class="mono" x="524" y="101" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#E8ECF3">ENTREGA</text>
<text class="sans" x="524" y="121" font-size="10.5" text-anchor="middle" fill="#7A8699">docker · semver</text>
<text class="sans" x="524" y="136" font-size="10.5" text-anchor="middle" fill="#7A8699">release marcada</text>
<rect class="ind a5" x="654" y="68" width="28" height="3" rx="1.5" fill="#34D399"/>
<text class="mono" x="668" y="101" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#E8ECF3">MANUTENÇÃO</text>
<text class="sans" x="668" y="121" font-size="10.5" text-anchor="middle" fill="#7A8699">dependabot ativo</text>
<text class="sans" x="668" y="136" font-size="10.5" text-anchor="middle" fill="#7A8699">em todo repositório</text>

<rect x="0.5" y="0.5" width="759" height="167" rx="8" fill="none" stroke="#202838" stroke-width="1"/>
</svg>
